---
layout: default
title: Posts
---
<p class="intro">{{ site.description }}</p>

<ul class="post-list">
  {% for post in site.posts %}
  <li>
    <span class="post-date">{{ post.date | date: "%b %d, %Y" }}</span>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    {% if post.tags.size > 0 %}
      <span class="post-tags">
        {% for tag in post.tags %}#{{ tag }} {% endfor %}
      </span>
    {% endif %}
  </li>
  {% endfor %}
</ul>
