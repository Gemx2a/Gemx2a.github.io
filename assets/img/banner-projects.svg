<svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="projBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDEBF5"/>
      <stop offset="100%" stop-color="#FAFAF8"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" fill="url(#projBg)"/>

  <!-- blueprint grid -->
  <g stroke="#453B78" stroke-width="0.7" opacity="0.12">
    <line x1="0" y1="30" x2="480" y2="30"/><line x1="0" y1="60" x2="480" y2="60"/>
    <line x1="0" y1="90" x2="480" y2="90"/><line x1="0" y1="120" x2="480" y2="120"/>
    <line x1="0" y1="150" x2="480" y2="150"/><line x1="0" y1="180" x2="480" y2="180"/>
    <line x1="40" y1="0" x2="40" y2="220"/><line x1="80" y1="0" x2="80" y2="220"/>
    <line x1="120" y1="0" x2="120" y2="220"/><line x1="160" y1="0" x2="160" y2="220"/>
    <line x1="200" y1="0" x2="200" y2="220"/><line x1="240" y1="0" x2="240" y2="220"/>
    <line x1="280" y1="0" x2="280" y2="220"/><line x1="320" y1="0" x2="320" y2="220"/>
    <line x1="360" y1="0" x2="360" y2="220"/><line x1="400" y1="0" x2="400" y2="220"/>
    <line x1="440" y1="0" x2="440" y2="220"/>
  </g>

  <!-- wrench -->
  <g transform="translate(150,110) rotate(-30)" fill="none" stroke="#453B78" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-10,-40 a16,16 0 1,0 20,0 a16,16 0 1,0 -20,0"/>
    <path d="M0,-8 L0,55" stroke-width="8"/>
    <path d="M-14,55 L14,55 L0,72 Z" fill="#453B78" stroke="none"/>
  </g>

  <!-- gear -->
  <g transform="translate(320,90)">
    <circle r="34" fill="none" stroke="#453B78" stroke-width="3.5"/>
    <circle r="12" fill="#FAFAF8" stroke="#453B78" stroke-width="3"/>
    <g stroke="#453B78" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-34" x2="0" y2="-46"/>
      <line x1="0" y1="34" x2="0" y2="46"/>
      <line x1="-34" y1="0" x2="-46" y2="0"/>
      <line x1="34" y1="0" x2="46" y2="0"/>
      <line x1="-24" y1="-24" x2="-32" y2="-32"/>
      <line x1="24" y1="24" x2="32" y2="32"/>
      <line x1="-24" y1="24" x2="-32" y2="32"/>
      <line x1="24" y1="-24" x2="32" y2="-32"/>
    </g>
  </g>

  <!-- code brackets -->
  <text x="235" y="180" font-family="'JetBrains Mono', monospace" font-size="34" fill="#453B78" opacity="0.7">&lt;/&gt;</text>
</svg>
