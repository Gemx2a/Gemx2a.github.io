    <circle cx="90" cy="160" r="7"/>
  </g>
  <g fill="#2A5C45">
    <circle cx="220" cy="80" r="6.5"/>
    <circle cx="220" cy="110" r="6.5"/>
    <circle cx="220" cy="140" r="6.5"/>
