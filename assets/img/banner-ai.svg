  <!-- network: input layer -->
  <g stroke="#2A5C45" stroke-width="1.4" opacity="0.55">
    <line x1="90" y1="60" x2="220" y2="80"/>
    <line x1="90" y1="60" x2="220" y2="110"/>
    <line x1="90" y1="60" x2="220" y2="140"/>
    <line x1="90" y1="110" x2="220" y2="80"/>
    <line x1="90" y1="110" x2="220" y2="110"/>
    <line x1="90" y1="110" x2="220" y2="140"/>
    <line x1="90" y1="160" x2="220" y2="80"/>
    <line x1="90" y1="160" x2="220" y2="110"/>
    <line x1="90" y1="160" x2="220" y2="140"/>

    <line x1="220" y1="80" x2="350" y2="95"/>
    <line x1="220" y1="80" x2="350" y2="125"/>
    <line x1="220" y1="110" x2="350" y2="95"/>
