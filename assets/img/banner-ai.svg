    <circle cx="260" cy="20" r="1.4"/><circle cx="300" cy="20" r="1.4"/><circle cx="340" cy="20" r="1.4"/>
    <circle cx="380" cy="20" r="1.4"/><circle cx="420" cy="20" r="1.4"/><circle cx="460" cy="20" r="1.4"/>
    <circle cx="20" cy="60" r="1.4"/><circle cx="60" cy="60" r="1.4"/><circle cx="100" cy="60" r="1.4"/>
    <circle cx="140" cy="60" r="1.4"/><circle cx="180" cy="60" r="1.4"/><circle cx="220" cy="60" r="1.4"/>
    <circle cx="260" cy="60" r="1.4"/><circle cx="300" cy="60" r="1.4"/><circle cx="340" cy="60" r="1.4"/>
    <circle cx="380" cy="60" r="1.4"/><circle cx="420" cy="60" r="1.4"/><circle cx="460" cy="60" r="1.4"/>
    <circle cx="20" cy="160" r="1.4"/><circle cx="60" cy="160" r="1.4"/><circle cx="100" cy="160" r="1.4"/>
    <circle cx="140" cy="160" r="1.4"/><circle cx="180" cy="160" r="1.4"/><circle cx="220" cy="160" r="1.4"/>
    <circle cx="260" cy="160" r="1.4"/><circle cx="300" cy="160" r="1.4"/><circle cx="340" cy="160" r="1.4"/>
    <circle cx="380" cy="160" r="1.4"/><circle cx="420" cy="160" r="1.4"/><circle cx="460" cy="160" r="1.4"/>
    <circle cx="20" cy="200" r="1.4"/><circle cx="60" cy="200" r="1.4"/><circle cx="100" cy="200" r="1.4"/>
    <circle cx="140" cy="200" r="1.4"/><circle cx="180" cy="200" r="1.4"/><circle cx="220" cy="200" r="1.4"/>
    <circle cx="260" cy="200" r="1.4"/><circle cx="300" cy="200" r="1.4"/><circle cx="340" cy="200" r="1.4"/>
    <circle cx="380" cy="200" r="1.4"/><circle cx="420" cy="200" r="1.4"/><circle cx="460" cy="200" r="1.4"/>
