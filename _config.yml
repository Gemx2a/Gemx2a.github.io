title: "Gemma's Field Notes"
description: "A working log of what I'm learning and building."
author: "Gemma"
github_username: Gemx2a
email: ""

# Shown on the homepage hero. Edit freely — this is your intro.
tagline: "I learn in public and build things along the way."
bio: >
  I'm Gemma. This site is where I keep a running log of what I'm learning —
  AI, payments, and whatever else pulls my attention — plus the projects I
  build off the back of it. Comment on anything; I'm happy to be corrected.
profile_image: "/assets/img/profile.svg"   # swap for a real photo, e.g. /assets/img/profile.jpg

url: "https://Gemx2a.github.io"
baseurl: ""

# Comments (giscus) — from https://giscus.app
giscus:
  repo: "Gemx2a/Gemx2a.github.io"
  repo_id: "PASTE_REPO_ID_HERE"
  category: "General"
  category_id: "PASTE_CATEGORY_ID_HERE"

# ---- Collections ----
# Every file in _knowledge/ becomes a knowledge entry.
# Every file in _projects/ becomes a project entry.
collections:
  knowledge:
    output: true
  projects:
    output: true

# ---- Knowledge categories ----
# To add a new category (e.g. "Design"), add a new block here with a
# unique key, then use that key in a post's front matter as `category: design`.
# `icon` is shown on card banners when an entry has no `image` of its own.
knowledge_categories:
  - key: ai
    name: "AI Knowledge"
    description: "Models, agents, and how they're built"
    icon: "🤖"
    banner: "/assets/img/banner-ai.svg"
  - key: payments
    name: "Payment Knowledge"
    description: "Fintech, transactions, and agentic commerce"
    icon: "💳"
    banner: "/assets/img/banner-payments.svg"

projects_icon: "🛠️"
projects_banner: "/assets/img/banner-projects.svg"

markdown: kramdown
permalink: /:year/:month/:day/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: "knowledge"
    values:
      layout: "knowledge-post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
